services:
  # ---------------------------------------------------------------------------
  # 1. Ollama – Local LLM & Vision Inference Engine
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 6

  # ---------------------------------------------------------------------------
  # 2. RAG API – FastAPI Custom Agent Server (LangGraph + Parent-Doc Retrieval)
  # ---------------------------------------------------------------------------
  rag-api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=llama3.1:8b
      - VISION_MODEL=qwen2.5vl
      - EMBEDDING_MODEL=nomic-embed-text
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network
    volumes:
      - ./data:/app/data
      - ./core:/app/core
      - ./config:/app/config
      - ./api_server.py:/app/api_server.py

  # ---------------------------------------------------------------------------
  # 3. Open WebUI – Multi-User Web Interface connected to Custom Agent Server
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URLS=http://rag-api:8000/v1
      - OPENAI_API_KEYS=sk-chem-rag
      - DEFAULT_MODELS=chem-rag-agent
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - rag-api
      - ollama
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  ollama_data:
  open-webui_data:
